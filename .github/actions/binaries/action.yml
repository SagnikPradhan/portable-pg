name: Binaries
description: Download the binaries a build job made and unpack them into vendor/postgres/<platform>.

inputs:
  platform:
    description: linux-x64, linux-arm64 or darwin-arm64
    required: true

runs:
  using: composite
  steps:
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: binaries-${{ inputs.platform }}
        path: vendor/postgres
    - run: |
        mkdir -p "vendor/postgres/$PLATFORM"
        tar -xzf vendor/postgres/*-"$PLATFORM".tar.gz -C "vendor/postgres/$PLATFORM" --strip-components=1
      shell: bash
      env:
        PLATFORM: ${{ inputs.platform }}
