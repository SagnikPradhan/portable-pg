name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - id: version
        run: |
          version=${GITHUB_REF_NAME#v}
          [[ $version =~ ^[0-9]+\.18[0-9]{4}\.[0-9]+$ ]] || {
            echo "::error::$GITHUB_REF_NAME is not a version of the form va.18xxyy.z"
            exit 1
          }
          echo "version=$version" >>"$GITHUB_OUTPUT"

  ci:
    needs: version
    uses: ./.github/workflows/ci.yml
    with:
      version: ${{ needs.version.outputs.version }}

  publish:
    needs: [version, ci]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: release
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: release
      - name: Check the tag names the Postgres inside
        run: |
          postgres=$(jq -r .postgres.version "release/portable-pg-$VERSION-linux-x64.manifest.json")
          expected=$(printf '18%02d' "${postgres#18.}")
          [[ $(cut -d. -f2 <<<"$VERSION") == "$expected"* ]] || {
            echo "::error::v$VERSION does not match Postgres $postgres, whose versions start a.${expected}yy"
            exit 1
          }
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: release/*
      - run: |
          manifest="release/portable-pg-$VERSION-linux-x64.manifest.json"
          title="v$VERSION: Postgres $(jq -r .postgres.version "$manifest"), pgvector $(jq -r '.pgvector.tag | ltrimstr("v")' "$manifest")"
          gh release create "v$VERSION" release/* --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "$title" --generate-notes
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      # Authenticates through npm's trusted publishing, which also adds provenance. See
      # https://docs.npmjs.com/trusted-publishers
      - run: npm publish "release/portable-pg-$VERSION.tgz"
